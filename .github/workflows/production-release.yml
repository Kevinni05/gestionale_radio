name: Signed Android production release
on:
  workflow_dispatch:
    inputs:
      update_manifest_url:
        description: Optional HTTPS manifest URL for the owner website
        type: string
        default: ''
      publish:
        description: Publish the verified APK as a public GitHub release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_EXPECTED_SIGNING_SHA256: ${{ secrets.ANDROID_SIGNING_SHA256 }}
      UPDATE_MANIFEST_URL: ${{ inputs.update_manifest_url }}
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://radiotechwebapp.onrender.com' }}
      ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'com.example.gestionale_radio' }}
      ANDROID_APP_LABEL: ${{ vars.ANDROID_APP_LABEL || 'RadioTech' }}
      MOBILE_APP_DISPLAY_NAME: ${{ vars.MOBILE_APP_DISPLAY_NAME || 'RadioTech' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate private update origin
        run: |
          node - <<'NODE'
          const fs=require('node:fs');let origin='';
          if(process.env.UPDATE_MANIFEST_URL){const uri=new URL(process.env.UPDATE_MANIFEST_URL);if(uri.protocol!=='https:'||uri.port||uri.username||uri.password||uri.search||uri.hash||!uri.pathname.endsWith('.json'))throw new Error('A canonical HTTPS manifest URL is required');origin=uri.origin;}
          fs.appendFileSync(process.env.GITHUB_ENV,`APK_UPDATE_ORIGIN=${origin}\n`);
          NODE
      - name: Prepare private signing identity
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          if (!process.env.ANDROID_KEYSTORE_BASE64 || !process.env.ANDROID_KEYSTORE_PASSWORD || !process.env.ANDROID_KEY_ALIAS || !process.env.ANDROID_KEY_PASSWORD || !/^[a-f0-9]{64}$/i.test(process.env.ANDROID_EXPECTED_SIGNING_SHA256 || '')) throw new Error('Production signing secrets are missing.');
          const store = path.join(process.env.RUNNER_TEMP, 'radiotech-production.p12');
          fs.writeFileSync(store, Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'), {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_ENV, `ANDROID_KEYSTORE_PATH=${store}\n`);
          NODE
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build production APK and AAB
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" --dart-define=APP_DISPLAY_NAME="$MOBILE_APP_DISPLAY_NAME" --dart-define=APK_UPDATE_ORIGIN="$APK_UPDATE_ORIGIN" --dart-define=UPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL" --dart-define=APP_CHECK_DEBUG=false --obfuscate --split-debug-info=release-symbols
          flutter build appbundle --release --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" --dart-define=APP_DISPLAY_NAME="$MOBILE_APP_DISPLAY_NAME" --dart-define=APK_UPDATE_ORIGIN="$APK_UPDATE_ORIGIN" --dart-define=UPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL" --dart-define=APP_CHECK_DEBUG=false --obfuscate --split-debug-info=release-symbols
      - name: Verify APK certificate and prepare release metadata
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$signer" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > certificate-report.txt
          node - <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const report = fs.readFileSync('certificate-report.txt','utf8'), certificate = report.match(/(?:Signer #1|V[234](?:\.\d+)? Signer):? certificate SHA-256 digest: ([a-f0-9]+)/i)?.[1]?.toLowerCase();
          if (certificate !== process.env.ANDROID_EXPECTED_SIGNING_SHA256.toLowerCase() || /Android Debug/i.test(report)) throw new Error('Unexpected signing certificate.');
          const match = fs.readFileSync('pubspec.yaml','utf8').match(/^version:\s*([^+\s]+)\+(\d+)/m);
          if (!match || Number(match[2]) <= 0) throw new Error('Release versionCode must be positive.');
          const product = (process.env.MOBILE_APP_DISPLAY_NAME || 'RadioTech').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'') || 'mobile';
          const name = `${product}-${match[1]}-${match[2]}`, tag = `v${match[1]}-${match[2]}`;
          fs.mkdirSync('artifacts',{recursive:true});
          fs.copyFileSync('build/app/outputs/flutter-apk/app-release.apk',`artifacts/${name}.apk`);
          fs.copyFileSync('build/app/outputs/bundle/release/app-release.aab',`artifacts/${name}.aab`);
          const repoUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const manifest = {available:false,channel:process.env.UPDATE_MANIFEST_URL?'PRIVATE_SITE':'GITHUB_RELEASES',applicationId:process.env.ANDROID_APPLICATION_ID,versionName:match[1],versionCode:Number(match[2]),signingSha256:certificate,sha256:crypto.createHash('sha256').update(fs.readFileSync(`artifacts/${name}.apk`)).digest('hex'),downloadUrl:process.env.UPDATE_MANIFEST_URL?new URL(`${name}.apk`,process.env.UPDATE_MANIFEST_URL).href:`${repoUrl}/releases/download/${tag}/${name}.apk`};
          fs.writeFileSync('artifacts/mobile-release.json',JSON.stringify(manifest,null,2));
          if(process.env.UPDATE_MANIFEST_URL)fs.writeFileSync('artifacts/latest.json',JSON.stringify({...manifest,available:true},null,2));
          fs.writeFileSync('artifacts/avviso-aggiornamento.txt',`È disponibile ${name}. Apri RadioTech e controlla gli aggiornamenti. Il pacchetto viene verificato prima dell'installazione.`);
          fs.writeFileSync('artifacts/release-notes.md','APK Android firmato di produzione. Report e archivi su Render, stato di connessione e aggiornamenti. Conservare i dati locali prima del passaggio da una build con firma differente.');
          fs.appendFileSync(process.env.GITHUB_ENV,`RELEASE_TAG=${tag}\nRELEASE_NAME=${name}\n`);
          NODE
      - name: Publish verified Android release when explicitly requested
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file artifacts/release-notes.md "artifacts/$RELEASE_NAME.apk" "artifacts/$RELEASE_NAME.aab" artifacts/mobile-release.json
      - name: Store signed release
        uses: actions/upload-artifact@v4
        with:
          name: android-production-${{ github.run_id }}
          path: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/mobile-release.json
            artifacts/latest.json
            artifacts/avviso-aggiornamento.txt
            certificate-report.txt
          retention-days: 30
      - name: Encrypt symbol files before offsite storage
        env:
          SYMBOLS_KEY_BASE64: ${{ secrets.ANDROID_SYMBOLS_KEY_BASE64 }}
        run: |
          tar -czf "$RUNNER_TEMP/release-symbols.tgz" release-symbols
          node - <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto'), path = require('node:path');
          const key = Buffer.from(process.env.SYMBOLS_KEY_BASE64 || '', 'base64');
          if (key.length !== 32) throw new Error('A dedicated symbols encryption key is required.');
          const nonce = crypto.randomBytes(12), cipher = crypto.createCipheriv('aes-256-gcm', key, nonce);
          const encrypted = Buffer.concat([cipher.update(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'release-symbols.tgz'))), cipher.final()]);
          fs.writeFileSync('artifacts/release-symbols.aesgcm', Buffer.concat([nonce, cipher.getAuthTag(), encrypted]));
          NODE
      - name: Store encrypted symbol files separately
        uses: actions/upload-artifact@v4
        with:
          name: android-private-symbols-${{ github.run_id }}
          path: artifacts/release-symbols.aesgcm
          retention-days: 30
