name: Gestionale Radio CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter analyze and tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Reject tracked private key material
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -E '(^|/)(\.env(\..*)?|key\.properties|[^/]+\.(jks|keystore|p12|pfx|pem|key))$' | grep -v -E '(^|/)\.env\.example$' > /tmp/radiotech-sensitive-files || true
          if [ -s /tmp/radiotech-sensitive-files ]; then
            echo 'Sensitive files must not be committed:'
            cat /tmp/radiotech-sensitive-files
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded --timeout 2m

  android-qa:
    name: Android QA compile
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compile Android QA application
        run: flutter build apk --debug --no-pub --target-platform android-arm64 --dart-define-from-file=config/render.json

      - name: Native transactional storage and cryptography tests
        # Native cryptography/SQLite tests are separate from the Dart boundary mocks.
        run: bash android/gradlew -p android :app:testDebugUnitTest --no-daemon

      - name: Store QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiotech-android-qa
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7


  distribute-android:
    name: Distribute Android to Firebase
    needs: [quality, android-qa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || '1:1051055442339:android:f495a6326f7a7465fb7216' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'gestionale-radio' }}
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://radiotechwebapp.onrender.com' }}
      ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'com.example.gestionale_radio' }}
      ANDROID_APP_LABEL: ${{ vars.ANDROID_APP_LABEL || 'RadioTech' }}
      MOBILE_APP_DISPLAY_NAME: ${{ vars.MOBILE_APP_DISPLAY_NAME || 'RadioTech' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check distribution configuration
        id: distribution-config
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] &&
             [ -n "$ANDROID_KEYSTORE_BASE64" ] &&
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] &&
             [ -n "$ANDROID_KEY_ALIAS" ] &&
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase App Distribution skipped: configure the distribution credentials and signing secrets."
          fi

      - name: Set up Flutter
        if: steps.distribution-config.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Set up Java
        if: steps.distribution-config.outputs.enabled == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable Android signing key
        if: steps.distribution-config.outputs.enabled == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/radiotech-distribution.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        if: steps.distribution-config.outputs.enabled == 'true'
        run: flutter pub get --enforce-lockfile

      - name: Build signed production APK
        if: steps.distribution-config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --no-pub \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" \
            --dart-define=APP_DISPLAY_NAME="$MOBILE_APP_DISPLAY_NAME" \
            --dart-define=APP_CHECK_DEBUG=false

      - name: Prepare Firebase credentials
        if: steps.distribution-config.outputs.enabled == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          CREDENTIALS_PATH="$RUNNER_TEMP/firebase-app-distribution.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_PATH"
          chmod 600 "$CREDENTIALS_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_PATH" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        if: steps.distribution-config.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Distribute APK to Firebase App Distribution
        if: steps.distribution-config.outputs.enabled == 'true'
        shell: bash
        env:
          FIREBASE_TESTERS: ${{ vars.FIREBASE_APP_DISTRIBUTION_TESTERS }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
        run: |
          set -euo pipefail
          npm install --global firebase-tools
          args=(
            appdistribution:distribute
            build/app/outputs/flutter-apk/app-release.apk
            --app "$FIREBASE_APP_ID"
            --project "$FIREBASE_PROJECT_ID"
            --release-notes "RadioTech automatic build ${GITHUB_SHA::7} from main"
          )
          if [ -n "$FIREBASE_TESTERS" ]; then
            args+=(--testers "$FIREBASE_TESTERS")
          fi
          if [ -n "$FIREBASE_GROUPS" ]; then
            args+=(--groups "$FIREBASE_GROUPS")
          fi
          firebase "${args[@]}"

      - name: Upload signed APK artifact
        if: steps.distribution-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radiotech-android-distribution
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14


  android-device:
    name: Android emulator persistence and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RADIOTECH_QA_BUILD: 'true'
      ANDROID_APPLICATION_ID: com.example.gestionale_radio.qa
      ANDROID_APP_LABEL: RadioTech QA
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: flutter test integration_test/operational_storage_test.dart -d emulator-5554 --reporter expanded
